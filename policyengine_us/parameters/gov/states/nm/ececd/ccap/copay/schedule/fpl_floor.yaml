description: New Mexico charges no copayment to families at or below this percentage of the federal poverty guideline under the Child Care Assistance Program.
# When the copay waiver expired on 2023-07-01, copays were reinstated only for
# families ABOVE 200% FPG; families at or below 200% FPG remained at $0. The
# comparison is inclusive of the floor itself: a family exactly at 200% FPG
# pays nothing.
values:
  2023-07-01: 2


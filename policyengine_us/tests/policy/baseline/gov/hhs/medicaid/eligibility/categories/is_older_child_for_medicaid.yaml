- name: MO child at 152% FPL, within the 148% base plus 5% disregard, eligible
  period: 2026
  input:
    age: 8
    medicaid_income_level: 1.52
    state_code: MO
  output:
    is_older_child_for_medicaid: true

# The formula compares with strict less-than, but the float32-stored input
# 1.53 (~1.52999997) lands just below the float64 parameter 1.53, so the
# exact boundary evaluates eligible under both < and <= — matching the
# manual's income-maximum (<=) semantics.
- name: MO child at exactly 153% FPL, the income maximum, eligible
  period: 2026
  input:
    age: 8
    medicaid_income_level: 1.53
    state_code: MO
  output:
    is_older_child_for_medicaid: true

- name: MO child at 154% FPL, above the 153% effective standard, ineligible
  period: 2026
  input:
    age: 8
    medicaid_income_level: 1.54
    state_code: MO
  output:
    is_older_child_for_medicaid: false

# Texas raises the older-child ceiling from 138% to 155% FPG effective
# 2026-01-01, aligning older children with the young-child ceiling.
- name: TX older child at exactly 138% FPL in 2025, the pre-2026 ceiling, eligible
  period: 2025
  input:
    age: 8
    medicaid_income_level: 1.38
    state_code: TX
  output:
    is_older_child_for_medicaid: true

- name: TX older child at 139% FPL in 2025, above the pre-2026 ceiling, ineligible
  period: 2025
  input:
    age: 8
    medicaid_income_level: 1.39
    state_code: TX
  output:
    is_older_child_for_medicaid: false

- name: TX older child at 139% FPL in 2026, inside the newly covered band, eligible
  period: 2026
  input:
    age: 8
    medicaid_income_level: 1.39
    state_code: TX
  output:
    is_older_child_for_medicaid: true

- name: TX older child at exactly 155% FPL in 2026, the new income maximum, eligible
  period: 2026
  input:
    age: 8
    medicaid_income_level: 1.55
    state_code: TX
  output:
    is_older_child_for_medicaid: true

- name: TX older child at 156% FPL in 2026, above the new ceiling, ineligible
  period: 2026
  input:

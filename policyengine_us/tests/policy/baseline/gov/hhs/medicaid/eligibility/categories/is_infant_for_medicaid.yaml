  period: 2025
  input:
    state_code: TX
    age: 0
    medicaid_income_level: 2.04
  output:
    is_infant_for_medicaid: false

- name: Infant at 204% FPL in 2026, inside the newly covered band, eligible in TX
  period: 2026
  input:
    state_code: TX
    age: 0
    medicaid_income_level: 2.04
  output:
    is_infant_for_medicaid: true


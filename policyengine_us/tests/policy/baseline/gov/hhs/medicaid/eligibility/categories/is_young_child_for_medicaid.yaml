- name: Child under 6 and FPL limit, eligible in CA
  period: 2022
  input:
    age: 3
    medicaid_income_level: 2.65
  output:
    is_young_child_for_medicaid: true

- name: Child under 6 but not FPL limit, ineligible in CA
  period: 2022
  input:
    age: 3
    medicaid_income_level: 2.66
  output:
    is_young_child_for_medicaid: false

- name: Child over 6, ineligible in CA
  period: 2022
  input:
    age: 6
  output:
    is_young_child_for_medicaid: false

- name: MO child at 152% FPL, within the 148% base plus 5% disregard, eligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.52
    state_code: MO
  output:
    is_young_child_for_medicaid: true

# The formula compares with strict less-than, but the float32-stored input
# 1.53 (~1.52999997) lands just below the float64 parameter 1.53, so the
# exact boundary evaluates eligible under both < and <= — matching the
# manual's income-maximum (<=) semantics.
- name: MO child at exactly 153% FPL, the income maximum, eligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.53
    state_code: MO
  output:
    is_young_child_for_medicaid: true

- name: MO child at 154% FPL, above the 153% effective standard, ineligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.54
    state_code: MO
  output:
    is_young_child_for_medicaid: false

# New Mexico raises the young-child ceiling from 305% to 310% FPG effective
# 2026-01-01. The 2025 cases pin the pre-change ceiling so the new effective
# date cannot silently rewrite prior years.
- name: NM young child at 305% FPL in 2025, at the pre-2026 ceiling, eligible
  period: 2025
  input:
    age: 3
    medicaid_income_level: 3.05
    state_code: NM
  output:
    is_young_child_for_medicaid: true

- name: NM young child at 306% FPL in 2025, above the pre-2026 ceiling, ineligible
  period: 2025
  input:
    age: 3
    medicaid_income_level: 3.06
    state_code: NM
  output:
    is_young_child_for_medicaid: false

# 306% is inside the 305%-310% band that the 2026-01-01 increase opens up: the
# same household is ineligible in 2025 and eligible in 2026.
- name: NM young child at 306% FPL in 2026, inside the newly covered band, eligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 3.06
    state_code: NM
  output:
    is_young_child_for_medicaid: true

# The formula compares with strict less-than, but the float32-stored input
# 3.10 (~3.09999990) lands just below the float64 parameter 3.10, so the exact
# boundary evaluates eligible under both < and <= — matching the income-maximum
# (<=) semantics used for the MO cases above.
- name: NM young child at exactly 310% FPL in 2026, the new income maximum, eligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 3.10
    state_code: NM
  output:
    is_young_child_for_medicaid: true

- name: NM young child at 311% FPL in 2026, above the new ceiling, ineligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 3.11
    state_code: NM
  output:
    is_young_child_for_medicaid: false

- name: Child under 6 and FPL limit, eligible in CA
  period: 2022
  input:
    age: 3
    medicaid_income_level: 2.65
  output:
    is_young_child_for_medicaid: true

- name: Child under 6 but not FPL limit, ineligible in CA
  period: 2022
  input:
    age: 3
    medicaid_income_level: 2.66
  output:
    is_young_child_for_medicaid: false

- name: Child over 6, ineligible in CA
  period: 2022
  input:
    age: 6
  output:
    is_young_child_for_medicaid: false

- name: MO child at 152% FPL, within the 148% base plus 5% disregard, eligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.52
    state_code: MO
  output:
    is_young_child_for_medicaid: true

# The formula compares with strict less-than, but the float32-stored input
# 1.53 (~1.52999997) lands just below the float64 parameter 1.53, so the
# exact boundary evaluates eligible under both < and <= — matching the
# manual's income-maximum (<=) semantics.
- name: MO child at exactly 153% FPL, the income maximum, eligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.53
    state_code: MO
  output:
    is_young_child_for_medicaid: true

- name: MO child at 154% FPL, above the 153% effective standard, ineligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.54
    state_code: MO
  output:
    is_young_child_for_medicaid: false

# Texas raises the young-child ceiling from 149% to 155% FPG effective
# 2026-01-01. The 2025 cases pin the pre-change ceiling so the new effective
# date cannot silently rewrite prior years.
- name: TX young child at 148% FPL in 2025, under the pre-2026 ceiling, eligible
  period: 2025
  input:
    age: 3
    medicaid_income_level: 1.48
    state_code: TX
  output:
    is_young_child_for_medicaid: true

# The formula compares with strict less-than and the float32-stored input 1.49
# (~1.49000001) lands just ABOVE the float64 parameter 1.49, so unlike the MO
# and NM cases the exact pre-2026 boundary evaluates ineligible here.
- name: TX young child at exactly 149% FPL in 2025, the pre-2026 ceiling, ineligible
  period: 2025
  input:
    age: 3
    medicaid_income_level: 1.49
    state_code: TX
  output:
    is_young_child_for_medicaid: false

# 152% is inside the 149%-155% band the 2026-01-01 increase opens up: the same
# household is ineligible in 2025 and eligible in 2026.
- name: TX young child at 152% FPL in 2026, inside the newly covered band, eligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.52
    state_code: TX
  output:
    is_young_child_for_medicaid: true

# The float32-stored input 1.55 (~1.54999995) lands just below the float64
# parameter 1.55, so the new boundary evaluates eligible under both < and <=.
- name: TX young child at exactly 155% FPL in 2026, the new income maximum, eligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.55
    state_code: TX
  output:
    is_young_child_for_medicaid: true

- name: TX young child at 156% FPL in 2026, above the new ceiling, ineligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.56
    state_code: TX
  output:
    is_young_child_for_medicaid: false
